[package]
name = "teledrive-rust"
version = "3.1.7"
edition = "2021"
description = "TeleDrive Native Rust Windows App"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v4"] }
chrono = "0.4"
mime_guess = "2.0"
dirs = "6.0"
url = "2.5"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
zip = { version = "=9.0.5", default-features = false }
rfd = "0.15.2"
tray-icon = "=0.20.0"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image"] }

[[bin]]
name = "TeleDriveR"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
