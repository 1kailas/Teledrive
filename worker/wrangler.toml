name = "teledrive-worker"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "teledrive-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "src/db/migrations"

# Environment variables (non-secret, set here or override in .dev.vars)
[vars]
MAX_CHUNK_SIZE = "47185920"
MAX_PARALLEL_UPLOADS = "3"
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"

# Local development
[dev]
port = 8787
local_protocol = "http"

# Cron triggers (Runs cleanup task daily at midnight UTC)
[triggers]
crons = ["0 0 * * *"]

