# TeleDrive via nginx — include in sites-enabled or nginx.conf http{} block.
# Set `server_name`, install a cert (certbot), and keep UPLOAD_SLICE_SIZE_MB
# <= 95 behind Cloudflare's free proxy (100 MB body limit).
# If running behind a real proxy, set TRUST_PROXY=true in .env so the app
# sees client IPs for rate limiting.
server {
    listen 80;
    listen [::]:80;
    server_name teledrive.example.com;

    # TLS example (after certbot):
    # listen 443 ssl; http2 on;
    # ssl_certificate     /etc/letsencrypt/live/teledrive.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/teledrive.example.com/privkey.pem;

    client_max_body_size 0;            # slices stream raw; no nginx cap
    proxy_request_buffering off;       # don't buffer request bodies to disk
    proxy_buffering off;               # stream responses (ranged downloads, SSE)
    proxy_read_timeout 3600s;          # multi-GB part fetches can stall mid-stream
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
