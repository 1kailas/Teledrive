name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    name: Web & Fastify Server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.2', '22.x']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Run Test Suite (Server + Web)
        run: npm test

      - name: Build Web SPA and Server
        run: npm run build

  desktop-windows:
    name: Desktop WinUI & Rust Core (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run WinUI .NET Unit Tests
        run: dotnet test winui-desktop/TeleDrive.Tests/TeleDrive.Tests.csproj -c Release

      - name: Build WinUI Desktop Release
        run: dotnet publish winui-desktop/TeleDrive.WinUI/TeleDrive.WinUI.csproj -c Release -p:Platform=x64 --self-contained true -o winui-desktop/publish

      - name: Run Rust Core Engine Tests
        run: |
          cd rust-desktop
          cargo test
