services:
  teledrive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teledrive
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
